global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - raft-rules.yml

scrape_configs:
  - job_name: cp-api
    static_configs:
      - targets: ["cp-api:9464"]
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9466"]
  - job_name: storage-node
    static_configs:
      - targets: ["a-1:28191", "a-2:28191", "a-3:28191", "a-4:28191", "b-1:28191", "b-2:28191", "b-3:28191"]
