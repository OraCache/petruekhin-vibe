global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - raft-rules.yml

scrape_configs:
  - job_name: cp-api
    static_configs:
      - targets: ["cp-api:9464"]
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9466"]
        labels: {region: region-a}
  - job_name: storage-node
    honor_labels: true
    static_configs:
      - targets: ["node-1:28191", "node-2:28191", "node-3:28191"]
        labels: {region: region-a}
